<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Namibia Health Services</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Lato', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-image: url('Desert Scope.jpeg');
            background-size: cover;
            background-position: center;
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: rgba(120, 120, 128, 0.30);
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 440px;
            padding: 20px;
        }
        h1 { color: #1a1a1a; text-align: center; margin-bottom: 8px; font-weight: 700; }
        .subtitle { text-align: center; color: #666; margin-bottom: 32px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; }
        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        input:focus { outline: none; border-color: #0066cc; }
        input.error { border-color: #f44336; }
        .error-message { color: #f44336; font-size: 13px; margin-top: 6px; display: none; }
        .error-message.visible { display: block; }
        .form-options { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; font-size: 14px; }
        .checkbox-wrapper { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .checkbox-wrapper input { width: auto; }
        .forgot-link { color: #0066cc; text-decoration: none; }
        .forgot-link:hover { text-decoration: underline; }
        button[type="submit"] {
            width: 100%;
            padding: 14px;
            background: #0066cc;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.2s;
        }
        button[type="submit"]:hover:not(:disabled) { background: #0052a3; }
        button[type="submit"]:disabled { background: #99c2e8; cursor: not-allowed; }
        .divider { text-align: center; margin: 24px 0; position: relative; color: #999; }
        .divider::before { content: ''; position: absolute; top: 50%; left: 0; right: 0; height: 1px; background: #e0e0e0; }
        .divider span { background: white; padding: 0 16px; position: relative; }
        .link-button {
            width: 100%;
            padding: 14px;
            background: white;
            color: #0066cc;
            border: 2px solid #0066cc;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
        }
        .link-button:hover { background: #f0f7ff; }
        .footer-links { text-align: center; margin-top: 24px; font-size: 14px; }
        .footer-links a { color: #0066cc; text-decoration: none; margin: 0 8px; }
        .footer-links a:hover { text-decoration: underline; }
        .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px); padding: 14px 24px; border-radius: 8px; color: white; font-weight: 500; box-shadow: 0 4px 20px rgba(0,0,0,0.2); opacity: 0; transition: all 0.3s ease; z-index: 1000; }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .toast.success { background: #4CAF50; }
        .toast.error { background: #f44336; }
        .toast.info { background: #2196F3; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Welcome Back</h1>
        <p class="subtitle">Sign in to access Namibia Health Services</p>

        <form id="loginForm" novalidate>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com">
                <div class="error-message" id="emailError"></div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Enter your password">
                <div class="error-message" id="passwordError"></div>
            </div>

            <div class="form-options">
                <label class="checkbox-wrapper">
                    <input type="checkbox" id="rememberMe" name="rememberMe">
                    <span>Remember me</span>
                </label>
                <a href="forgot-password.html" class="forgot-link">Forgot password?</a>
            </div>

            <button type="submit" id="submitBtn">Sign In</button>
        </form>

        <div class="divider"><span>Don't have an account?</span></div>
        <button type="button" class="link-button" onclick="window.location.href='signup.html'">Create Account</button>

        <div class="footer-links">
            <a href="privacy-policy.html">Privacy Policy</a> |
            <a href="terms-of-service.html">Terms of Service</a>
        </div>
    </div>

    <div id="globalToast" class="toast" role="alert" aria-live="polite"></div>

    <script type="module">
        import { 
            signIn, 
            isValidEmail,
            initInactivityTimer,
            showToast,
            getCurrentUser 
        } from './firebase-health-services.js';

        // Inactivity timer (30 min for auth pages)
        initInactivityTimer(30 * 60 * 1000, () => {
            showToast('Session expired. Please try again.', 'info');
            setTimeout(() => window.location.reload(), 2000);
        });

        // DOM Elements
        const form = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const emailError = document.getElementById('emailError');
        const passwordError = document.getElementById('passwordError');
        const rememberMe = document.getElementById('rememberMe');

        // Check for remembered email
        if (localStorage.getItem('rememberedEmail')) {
            emailInput.value = localStorage.getItem('rememberedEmail');
            rememberMe.checked = true;
        }

        // Check if already logged in
        const currentUser = getCurrentUser();
        if (currentUser) {
            window.location.href = 'dashboard.html';
        }

        // Toast notification
        function showToast(message, type = 'info') {
            const toast = document.getElementById('globalToast');
            toast.textContent = message;
            toast.className = `toast show ${type}`;
            setTimeout(() => toast.classList.remove('show'), 4000);
        }

        // Error handling
        function setError(input, errorEl, message) {
            input.classList.add('error');
            errorEl.textContent = message;
            errorEl.classList.add('visible');
        }

        function clearError(input, errorEl) {
            input.classList.remove('error');
            errorEl.classList.remove('visible');
        }

        // Clear errors on input
        [emailInput, passwordInput].forEach(input => {
            input.addEventListener('input', () => {
                const errorEl = document.getElementById(`${input.id}Error`);
                clearError(input, errorEl);
            });
        });

        // Validate form
        function validateForm() {
            let isValid = true;

            if (!emailInput.value.trim()) {
                setError(emailInput, emailError, 'Email is required');
                isValid = false;
            } else if (!isValidEmail(emailInput.value.trim())) {
                setError(emailInput, emailError, 'Please enter a valid email address');
                isValid = false;
            } else {
                clearError(emailInput, emailError);
            }

            if (!passwordInput.value) {
                setError(passwordInput, passwordError, 'Password is required');
                isValid = false;
            } else {
                clearError(passwordInput, passwordError);
            }

            return isValid;
        }

        // Form submission
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            if (!validateForm()) return;

            submitBtn.disabled = true;
            submitBtn.textContent = 'Signing In...';

            try {
                await signIn(emailInput.value.trim(), passwordInput.value);

                // Handle remember me
                if (rememberMe.checked) {
                    localStorage.setItem('rememberedEmail', emailInput.value.trim());
                } else {
                    localStorage.removeItem('rememberedEmail');
                }

                showToast('Welcome back!', 'success');

                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1000);

            } catch (error) {
                showToast(error.message, 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign In';
            }
        });
    </script>
</body>
</html>
