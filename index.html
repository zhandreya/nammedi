            background-image: url('Desert Scope.jpeg');

            background-attachment: fixed;

            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 60px;
            padding-bottom: 40px;
            line-height: 1.6;
            color: #000000;
            padding: 0;
        }

            margin: 50px auto;
        }

        }

        .heart-image {

            height: 180px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }
        .content { text-align: center; width: 100%; }
        .start-button {

            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;

        }
        .start-button:hover {
            background: linear-gradient(135deg, #4CAF50 0%, #388E3C 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(76, 175, 80, 0.5);
        }
        .start-button:focus {
            outline: 3px solid #0066cc;
            outline-offset: 3px;
        }
        .subtitle {
            margin-top: 20px;
            color: #555;
            font-size: 14px;
        }
    </style>

    <div class="container">
        <h1 class="title">NAMIBIAN MEDICAL RECORDS</h1>

            <img src="Nam heart.jpeg" alt="Heart with Namibian flag" class="heart-image">

        <div class="content">
            <a class="start-button" id="startBtn" href="./start.html">Get Started</a>
            <p class="subtitle">Secure health records management for Namibia</p>
        </div>
    </div>
