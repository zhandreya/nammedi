<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Namibian Medical Records</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Lato, sans-serif;
            background-image: url('Desert Scope.jpeg');
            background-size: cover;
            background-position: center;
            line-height: 1.6;
            color: #000000;
            margin: 0;
            padding: 0;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }
        .container {
            background-color: rgba(120, 120, 128, 0.30);
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 5px;
            margin: 50px auto;
            padding: 20px;
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #backBtn {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 5px 10px;
            background-color: transparent;
            border: 1px solid #333;
            cursor: pointer;
            color: #000000;
            border-radius: 5px;
        }
        .title {
            font-family: 'Lato', sans-serif;
            font-weight: 900;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            margin-bottom: 30px;
            margin-top: 0;
            color: #1a1a1a;
            font-size: clamp(32px, 6vw, 56px);
            text-align: center;
            line-height: 1.2;
        }
        .logo-container { margin-bottom: 30px; }
        .heart-image {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }
        .content { text-align: center; width: 100%; }
        .start-button {
            padding: 16px 48px;
            font-family: 'Lato', sans-serif;
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(135deg, #0066cc 0%, #004499 100%);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 16px rgba(0, 102, 204, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .start-button:hover {
            background: linear-gradient(135deg, #4CAF50 0%, #388E3C 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(76, 175, 80, 0.5);
        }
        .start-button:focus {
            outline: 3px solid #0066cc;
            outline-offset: 3px;
        }
        .subtitle {
            margin-top: 20px;
            color: #555;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">NAMIBIAN MEDICAL RECORDS</h1>
        <div class="logo-container">
            <img src="Nam heart.jpeg" alt="Heart with Namibian flag" class="heart-image">
        </div>
        <div class="content">
            <button type="button" class="start-button" id="startBtn">Get Started</button>
            <p class="subtitle">Secure health records management for Namibia</p>
        </div>
    </div>

    <script type="module">
        import { onAuthChange, initInactivityTimer } from './supabase-health-services.js';

        initInactivityTimer(30 * 60 * 1000, () => window.location.reload());

        onAuthChange(() => {});

        document.getElementById('startBtn').addEventListener('click', () => {
            window.location.href = 'start.html';
        });
    </script>
    <script>
        document.getElementById('startBtn').addEventListener('click', function () {
            window.location.href = 'start.html';
        });
    </script>
</body>
</html>
